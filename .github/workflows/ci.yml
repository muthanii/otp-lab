name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: VERSION matches the Release Please manifest
        run: test "$(cat VERSION)" = "$(jq -r '."."' .github/release-please-manifest.json)"

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Compose file is valid
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build
